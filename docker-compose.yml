services:
  db:
    image: postgis/postgis:16-3.4
    container_name: bus
    restart: unless-stopped
    environment:
      POSTGRES_USER: Rahel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in backend/.env}
      POSTGRES_DB: bus_tracker
    ports:
      - "5434:5432" # 5434 on your computer, so it does not clash with a local PostgreSQL
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U Rahel -d bus_tracker"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    container_name: bus_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://Rahel:${POSTGRES_PASSWORD}@db:5432/bus_tracker
      PORT: 3000
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-Administrator}
      NIGHTLY_JOBS: ${NIGHTLY_JOBS:-on}
    ports:
      - "3000:3000"

volumes:
  db_data:
