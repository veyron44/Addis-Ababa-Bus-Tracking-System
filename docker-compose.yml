services:
  db:
    image: postgis/postgis:16-3.4
    container_name: bus
    restart: unless-stopped
    environment:
      POSTGRES_USER: Rahel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: bus_tracker
    ports:
      - "5434:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U Rahel -d bus_tracker"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db_data:
